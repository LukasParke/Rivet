# Rivet front proxy. The master process stays root (binds the listen socket,
# manages workers); workers run unprivileged as `appuser`.
#
# TLS termination MUST happen in front of this nginx in every non-dev
# deployment: rivet-server marks the session cookie `Secure` whenever
# APP_ENV != dev, and Secure cookies are only sent over HTTPS.
worker_processes auto;
user appuser;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr;
	sendfile on;

	# Workers run as `appuser`; keep writable temp dirs under /tmp like pid.
	client_body_temp_path /tmp/nginx/client_body;
	proxy_temp_path /tmp/nginx/proxy;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	upstream rivet_api {
		server 127.0.0.1:8081;
	}

	upstream rivet_web {
		server 127.0.0.1:3000;
	}

	server {
		listen 8080;
		server_name _;

		# API
		location /api/ {
			proxy_pass http://rivet_api;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		# WebSocket
		location /ws {
			proxy_pass http://rivet_api;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		}

		# Container HEALTHCHECK passthroughs (exact-match beats the /
		# catch-all below): one probe then validates nginx -> rivet-api
		# -> SQLite without touching the web upstream.
		location = /healthz {
			proxy_pass http://rivet_api;
			proxy_set_header Host $host;
		}
		location = /readyz {
			proxy_pass http://rivet_api;
			proxy_set_header Host $host;
		}

		# Everything else: SvelteKit SSR
		location / {
			proxy_pass http://rivet_web;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}
