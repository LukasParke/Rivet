[package]
name = "rivet"
version = "0.2.0"
edition = "2021"
description = "Media automation control plane"

[[bin]]
name = "rivet-server"
path = "src/main.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
url = "2"
futures-util = "0.3"
async-trait = "0.1"
percent-encoding = "2"
roxmltree = "0.20"
sha1 = "0.10"
regex = "1"
tokio-tungstenite = "0.24"
tempfile = "3"
libc = "0.2"
hmac = "0.12"

[dev-dependencies]
wiremock = "0.6"
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
futures-util = "0.3"

[[bench]]
name = "domain_benches"
harness = false

[[bench]]
name = "storage_benches"
harness = false

[[bench]]
name = "ws_bench"
harness = false

[profile.release]
lto = "thin"
strip = true
