openapi: 3.0.3
info:
  title: Rivet Media Automation Control Plane API
  version: 0.1.0
paths:
  /api/v1/auth/csrf:
    get:
      summary: Get CSRF token for current session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Unauthorized
  /api/v1/auth/login:
    post:
      summary: Login (creates session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /api/v1/auth/logout:
    post:
      summary: Logout (revokes session cookie)
      responses:
        '204':
          description: No content
        '403':
          description: CSRF required
  /api/v1/auth/me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
        '401':
          description: Unauthorized
  /api/v1/setup/status:
    get:
      summary: Setup mode status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupMode:
                    type: boolean
                  dryRun:
                    type: boolean
                  dryRunFixturePathSet:
                    type: boolean
  /api/v1/setup/admin:
    post:
      summary: Create initial admin (setup only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
        '409':
          description: Setup already completed
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
  /api/v1/setup/paths/validate:
    post:
      summary: Validate filesystem paths (setup wizard)
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/setup/paths/save:
    post:
      summary: Save filesystem paths (setup wizard)
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
  /api/v1/setup/clients/validate:
    post:
      summary: Validate download clients (setup wizard)
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/setup/clients/save:
    post:
      summary: Save download client configs (setup wizard)
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
  /api/v1/setup/indexers/validate:
    post:
      summary: Validate indexers (Torznab/Newznab) (setup wizard)
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/setup/indexers/save:
    post:
      summary: Save indexer configs (setup wizard)
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
  /api/v1/setup/metadata/validate:
    post:
      summary: Validate metadata providers (TMDB/TVDB) (setup wizard)
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/setup/metadata/save:
    post:
      summary: Save metadata provider configs (setup wizard)
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
  /api/v1/setup/policies/validate:
    post:
      summary: Validate policies (setup wizard)
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/setup/policies/save:
    post:
      summary: Save policies (setup wizard)
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
  /api/v1/setup/finish:
    post:
      summary: Finish setup (store report, close registration)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/targets:
    get:
      summary: List targets
      responses:
        '200': { description: OK }
    post:
      summary: Create target
      responses:
        '201': { description: Created }
  /api/v1/targets/{id}/search:
    post:
      summary: Start a search run for target
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Accepted }
  /api/v1/search/runs/{id}:
    get:
      summary: Get search run results
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/v1/diagnostics/bundle:
    get:
      summary: Diagnostics bundle (sanitized)
      responses:
        '200': { description: OK }
  /api/v1/acquisitions:
    get:
      summary: List acquisitions
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200': { description: OK }
  /api/v1/acquisitions/{id}/actions/pause:
    post:
      summary: Pause an acquisition download (client control)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
        '502':
          description: Upstream client error


  /api/v1/acquisitions/{id}/actions/resume:
    post:
      summary: Resume an acquisition download (client control)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
        '502':
          description: Upstream client error


  /api/v1/acquisitions/{id}/actions/retry:
    post:
      summary: Retry an acquisition (re-enqueue acquisition_enqueue)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
        '502':
          description: Upstream client error


  /api/v1/acquisitions/{id}/actions/remove:
    post:
      summary: Remove an acquisition from client (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: deleteFiles
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
        '502':
          description: Upstream client error


  /api/v1/acquisitions/{id}/actions/reverify:
    post:
      summary: Re-run verification for a needs_review acquisition (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
  /api/v1/acquisitions/{id}/actions/reimport:
    post:
      summary: Re-run import for a needs_review acquisition (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
  /api/v1/acquisitions/{id}/actions/accept_verified:
    post:
      summary: Admin override - accept an acquisition as verified and enqueue import (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                verifiedPath:
                  type: string
      responses:
        '200': { description: OK }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
  /api/v1/acquisitions/{id}/actions/blacklist:
    post:
      summary: Add current acquisition candidate to blacklist (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  description: target|global
                reason:
                  type: string
      responses:
        '200': { description: OK }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
  /api/v1/acquisitions/{id}/actions/blacklist_and_rescout:
    post:
      summary: Add candidate to blacklist and enqueue rescout (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  description: target|global
                reason:
                  type: string
      responses:
        '200': { description: OK }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
  /api/v1/acquisitions/{id}/actions/override_imported:
    post:
      summary: Manually mark an acquisition imported (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importedPath]
              properties:
                importedPath:
                  type: string
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden/CSRF }
  /api/v1/acquisitions/{id}:
    get:
      summary: Get acquisition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /healthz:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
  /readyz:
    get:
      summary: Readiness
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /api/v1/candidates/{id}/acquisition:
    post:
      summary: Create an acquisition for an accepted candidate (idempotent per candidate)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Created }
        '200': { description: Already exists for this candidate }
        '400': { description: candidate not found or not accepted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden or csrf_required }
  /api/v1/setup/config:
    get:
      summary: Full setup configuration (secrets decrypted; admin only)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /api/v1/diagnostics/test-connection:
    post:
      summary: Validate and probe a configured URL under the outbound SSRF policy
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Probe result (ok flag with error detail on failure)
        '400': { description: invalid_url, disallowed_target, dns_failure }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /metrics:
    get:
      summary: Prometheus text exposition of job/queue metrics
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
  /ws:
    get:
      summary: WebSocket event stream (session-authenticated upgrade)
      responses:
        '101': { description: Switching Protocols }
        '401': { description: Unauthorized (pre-upgrade) }
  /ws/info:
    get:
      summary: WebSocket endpoint probe
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rivet_session
